<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#082c25"><title>QUIZ ENF • CLM D’OR</title><meta name="description" content="Dois quizzes educativos: perigos do cigarro eletrônico e saúde pública básica."><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23082c25'/%3E%3Cpath d='M13 6h6v7h7v6h-7v7h-6v-7H6v-6h7z' fill='%2374e2b6'/%3E%3C/svg%3E"><style>
:root{color-scheme:dark;--mint:#83e9bb;--gold:#d6ad52;--line:#386254}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 90% 0%,#24594a,transparent 55%),#071c18;color:#fff;font:17px/1.6 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:4px}button:disabled{cursor:default}main{max-width:780px;margin:auto;padding:28px 22px 45px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:34px}.logo{width:160px;height:66px;object-fit:contain}.brand{font-size:13px;color:var(--mint);letter-spacing:2px;font-weight:700}.pill{border:1px solid #416151;border-radius:40px;padding:5px 13px;font-size:13px;color:#d2e6da}.eyebrow{color:var(--gold);font-size:14px;font-weight:650;letter-spacing:2px}h1{font-size:clamp(38px,8vw,64px);line-height:1.05;letter-spacing:-2px;margin:12px 0 20px}h2{font-size:clamp(25px,4vw,34px);line-height:1.4;margin:20px 0 25px;color:white}p{color:#d5e8de}.intro{max-width:530px}.card{background:linear-gradient(135deg,#163f33,#0c2c24);border:1px solid var(--line);border-radius:26px;padding:28px;margin-top:25px;box-shadow:0 20px 60px #0003}label{display:block;margin-bottom:10px;font-weight:650}input{width:100%;background:#071f18;color:white;border:1px solid #47735f;padding:16px;border-radius:14px;margin-bottom:18px}.primary{width:100%;border:0;border-radius:14px;background:var(--mint);color:#09271d;font-weight:750;padding:16px 20px}.primary:hover{background:#a4f5d0}.secondary{border:1px solid #52735f;background:transparent;color:#e1f2e9;border-radius:14px;padding:12px 20px}.meta{display:flex;justify-content:space-between;gap:12px;color:#b6d6c7;font-size:14px}.progress{height:7px;background:#233f34;border-radius:10px;margin:17px 0;overflow:hidden}.progress span{display:block;background:var(--mint);height:100%;transition:width .3s}.option{display:flex;gap:16px;align-items:flex-start;width:100%;text-align:left;margin:12px 0;padding:17px;background:#0e2b22;color:white;border:1px solid #3e6050;border-radius:16px;line-height:1.55;transition:background .15s}.letter{display:grid;place-items:center;flex:none;width:32px;height:32px;border:1px solid #5d7965;border-radius:9px;font-size:15px;font-weight:750}.option.selected{border-color:var(--mint);background:#23573e;box-shadow:0 0 0 1px var(--mint)}.option.correct{border-color:var(--mint);background:#1c583c}.option.wrong{border-color:#f19a91;background:#57302b}.option:disabled{color:#fff;opacity:1}.feedback{border-left:4px solid var(--mint);padding:14px 18px;margin:25px 0;background:#08251c;border-radius:0 12px 12px 0}.feedback.bad{border-color:#f19a91}.feedback p{margin:9px 0}.error{color:#ffc3b8;font-size:15px;margin:5px 0 15px}.fine{font-size:14px;color:#99b9a8}.facts{display:flex;gap:24px;margin:26px 0;color:#b0cabc;font-size:14px}.facts b{display:block;font-size:23px;color:white}.score{font-size:72px;font-weight:800;line-height:1.2;color:var(--mint);margin:18px 0}.score small{font-size:28px;color:#b6d6c7}.actions{display:flex;gap:12px;margin:25px 0;flex-wrap:wrap}.actions button{flex:1}details{border-bottom:1px solid var(--line);padding:18px 0}summary{cursor:pointer;font-size:17px;font-weight:600}.tag{color:var(--mint);font-size:14px}footer{margin-top:35px;border-top:1px solid var(--line);padding-top:20px;display:flex;justify-content:space-between;gap:15px;font-size:13px;color:#98b7a7}footer button{border:0;background:none;color:var(--mint);padding:0;font-size:14px}#status{color:var(--mint);font-size:14px} .topic-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin:28px 0}.topic-card{text-align:left;color:white;background:linear-gradient(135deg,#163f33,#0c2c24);border:1px solid var(--line);border-radius:24px;padding:24px}.topic-card:hover{border-color:var(--mint);background:#1c4939}.topic-card h2{font-size:27px;margin:16px 0}.topic-card p{font-size:16px}@media(max-width:600px){.topic-grid{grid-template-columns:1fr}}@media(max-width:520px){main{padding:20px 16px}.card{padding:20px;border-radius:22px}header{margin-bottom:25px}.logo{width:125px}.pill{font-size:12px}.option{padding:15px 12px;font-size:18px;gap:12px}.actions{flex-direction:column}footer{flex-wrap:wrap}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main><header><img class="logo" src="hospital.png" alt="CLM D’OR Hospital"><span class="pill">Feira escolar</span></header><section id="app" aria-live="polite"></section><footer><span>CLM D’OR · QUIZ ENF</span><button id="share">Copiar link do quiz</button></footer><p id="status" role="status"></p></main><script>
const QUESTIONS=[{"prompt": "Qual é a principal substância psicoativa encontrada na grande maioria dos líquidos utilizados em cigarros eletrônicos (vapes)?", "options": ["Ácido acetilsalicílico vaporizado", "Nicotina sintética ou derivada do tabaco", "Etanol hidratado concentrado", "Canabidiol puro sem aditivos"], "correct_index": 1, "explanation": "A nicotina é a substância psicoativa presente na maioria dos líquidos de vape. Ela causa dependência, inclusive nas versões com sabores que parecem inofensivas."}, {"prompt": "O que caracteriza a doença pulmonar associada ao uso de produtos de cigarro eletrônico ou vaporização, conhecida pela sigla EVALI?", "options": ["Uma mutação genética hereditária nos brônquios", "Uma lesão pulmonar grave com inflamação aguda associada a substâncias como o acetato de vitamina E", "Uma forma leve de asma alérgica sazonal reversível", "Uma infecção bacteriana idêntica à tuberculose resistente"], "correct_index": 1, "explanation": "A EVALI é uma lesão pulmonar aguda e grave ligada ao uso de vapes, associada a substâncias como o acetato de vitamina E. Não é hereditária nem uma infecção."}, {"prompt": "Muitos jovens acreditam que os vapes liberam apenas 'vapor de água'. O que realmente compõe o aerossol expelido pelos dispositivos?", "options": ["Vitaminas essenciais e compostos orgânicos multivitamínicos", "Oxigênio enriquecido benéfico para a capacidade pulmonar", "Um aerossol com micropartículas de nicotina, metais pesados, propilenoglicol e substâncias tóxicas", "Estritamente vapor de água pura e aromatizantes naturais inofensivos"], "correct_index": 2, "explanation": "O que sai do vape é um aerossol, não vapor de água. Ele carrega micropartículas de nicotina, metais pesados, propilenoglicol e outras substâncias tóxicas."}, {"prompt": "Qual é o impacto do uso prolongado de cigarros eletrônicos sobre o sistema cardiovascular humano?", "options": ["Redução permanente da pressão arterial sistêmica para níveis ideais", "Aumento da rigidez arterial, elevação da frequência cardíaca e maior risco de eventos trombóticos", "Estímulo direto ao crescimento de novos vasos sanguíneos saudáveis", "Melhora significativa na oxigenação do músculo cardíaco"], "correct_index": 1, "explanation": "A nicotina e as demais substâncias do aerossol enrijecem as artérias, aceleram o coração e aumentam o risco de formação de coágulos (eventos trombóticos)."}, {"prompt": "Como a nicotina presente nos cigarros eletrônicos afeta o cérebro em desenvolvimento de adolescentes e jovens?", "options": ["Estimula o desenvolvimento acelerado de áreas ligadas ao raciocínio lógico avançado", "Promove a regeneração rápida de neurônios danificados no córtex pré-frontal", "Gera imunidade permanente contra transtornos de ansiedade generalizada", "Altera as conexões sinápticas, prejudicando a atenção, o aprendizado e aumentando a vulnerabilidade ao vício"], "correct_index": 3, "explanation": "O cérebro segue em desenvolvimento até cerca de 25 anos. A nicotina altera as conexões sinápticas, prejudica atenção e aprendizado e deixa o jovem mais vulnerável ao vício."}, {"prompt": "Quais metais pesados tóxicos são frequentemente encontrados no vapor gerado por cigarros eletrônicos devido ao aquecimento das bobinas?", "options": ["Cobre isolado e zinco biológico nutritivo", "Ouro coloidal e prata ionizada medicinal", "Ferro magnético puro e alumínio alimentar inofensivo", "Chumbo, níquel, estanho e cromo"], "correct_index": 3, "explanation": "O aquecimento das bobinas libera metais tóxicos no aerossol, como chumbo, níquel, estanho e cromo, que são inalados diretamente pelo usuário."}, {"prompt": "Qual é a situação regulatória oficial da comercialização, importação e propaganda de cigarros eletrônicos no Brasil, segundo a ANVISA?", "options": ["Proibição total da venda, importação e propagandas em todo o território nacional", "Liberdade total de comercialização para maiores de 18 anos sem restrições", "Exclusividade de venda sob prescrição médica em farmácias magistrais", "Permissão apenas para modelos sem nicotina em lojas especializadas"], "correct_index": 0, "explanation": "No Brasil, a ANVISA proíbe a comercialização, a importação e a propaganda de cigarros eletrônicos em todo o território nacional."}, {"prompt": "O apelo dos aromatizantes e sabores artificiais doces ou frutados nos vapes tem como principal consequência mercadológica:", "options": ["Atrair o público jovem e infantil, mascarando a percepção de perigo e facilitando a experimentação", "Garantir que o vapor seja biodegradável e não polua o meio ambiente", "Ajudar fumantes idosos a abandonarem o vício do cigarro tradicional de forma definitiva", "Neutralizar completamente os efeitos nocivos da nicotina no organismo"], "correct_index": 0, "explanation": "Os sabores doces e frutados atraem jovens e crianças, escondem a sensação de perigo e facilitam a primeira experimentação. Eles não reduzem o dano da nicotina."}, {"prompt": "De que maneira o descarte incorreto de cigarros eletrônicos descartáveis afeta o meio ambiente?", "options": ["Servem como adubo orgânico rico em nutrientes para plantações urbanas", "Não causam impacto ambiental relevante por serem pequenos e leves", "Eles se decompõem rapidamente na natureza por serem feitos de celulose vegetal", "Causa poluição por plásticos não recicláveis, metais pesados e contaminação do solo por baterias de íon-lítio"], "correct_index": 3, "explanation": "Os descartáveis misturam plástico, metais e baterias de íon-lítio. Jogados no lixo comum, poluem e contaminam o solo, e não se decompõem rapidamente."}, {"prompt": "Qual é a relação científica observada entre o uso de cigarros eletrônicos e a transição para o cigarro convencional de tabaco?", "options": ["O vape elimina totalmente o desejo psicológico por qualquer outra forma de tabaco", "Usuários de vape jovens apresentam maior probabilidade de experimentarem e adotarem o cigarro convencional no futuro.", "O uso de vape protege o organismo contra os malefícios da fumaça do cigarro comum", "Não existe nenhuma correlação estatística entre o uso de ambas as substâncias"], "correct_index": 1, "explanation": "Estudos mostram que jovens que usam vape têm mais chance de experimentar e adotar o cigarro convencional depois. O vape pode funcionar como porta de entrada para o tabaco."}];
const HEALTH_QUESTIONS=[{"prompt": "O que significa a sigla SUS?", "options": ["Serviço Unificado de Saúde", "Sistema Único de Saúde", "Sistema Universal de Segurança", "Setor Unido de Saúde"], "correct_index": 1, "explanation": "Resposta correta: Sistema Único de Saúde."}, {"prompt": "O atendimento no SUS é:", "options": ["Pago, somente para quem tem plano de saúde", "Exclusivo para idosos", "Gratuito e para todas as pessoas", "Apenas para quem trabalha com carteira assinada"], "correct_index": 2, "explanation": "Resposta correta: Gratuito e para todas as pessoas."}, {"prompt": "Qual é o local mais comum para o primeiro atendimento de saúde no SUS?", "options": ["Centro cirúrgico do hospital", "Unidade Básica de Saúde (UBS)", "Laboratório de pesquisa", "Farmácia particular"], "correct_index": 1, "explanation": "Resposta correta: Unidade Básica de Saúde (UBS)."}, {"prompt": "Qual destes serviços é oferecido na Atenção Básica?", "options": ["Transplante de órgãos", "Cirurgia cardíaca", "Vacinação", "Tratamento em UTI"], "correct_index": 2, "explanation": "Resposta correta: Vacinação."}, {"prompt": "Quem é o profissional que visita as casas da comunidade para acompanhar as famílias?", "options": ["Agente Comunitário de Saúde", "Cirurgião", "Radiologista", "Anestesista"], "correct_index": 0, "explanation": "Resposta correta: Agente Comunitário de Saúde."}, {"prompt": "Qual é o objetivo principal da vacinação?", "options": ["Curar doenças que a pessoa já tem", "Prevenir doenças", "Substituir a alimentação", "Aumentar o peso corporal"], "correct_index": 1, "explanation": "Resposta correta: Prevenir doenças."}, {"prompt": "O que é o Cartão SUS?", "options": ["Um cartão para pagar compras em farmácias", "Um documento que substitui a carteira de motorista", "Um cartão de crédito do governo", "Um cartão que identifica o usuário do sistema de saúde"], "correct_index": 3, "explanation": "Resposta correta: Um cartão que identifica o usuário do sistema de saúde."}, {"prompt": "O que é um prontuário eletrônico?", "options": ["Um registro digital com as informações de saúde do paciente", "Um aparelho para medir a temperatura", "Um jogo para computador", "Uma máquina de lavar materiais"], "correct_index": 0, "explanation": "Resposta correta: Um registro digital com as informações de saúde do paciente."}, {"prompt": "Por que o profissional de saúde não deve compartilhar sua senha do sistema?", "options": ["Porque a senha só funciona uma vez", "Porque o computador fica mais lento", "Porque o sistema cobra uma taxa por senha", "Para proteger as informações e o sigilo dos pacientes"], "correct_index": 3, "explanation": "Resposta correta: Para proteger as informações e o sigilo dos pacientes."}, {"prompt": "Qual hábito ajuda a prevenir doenças e faz parte do cuidado na atenção básica?", "options": ["Nunca ir ao médico", "Lavar bem as mãos e manter consultas de rotina", "Tomar remédio sem orientação", "Passar o dia inteiro sem beber água"], "correct_index": 1, "explanation": "Resposta correta: Lavar bem as mãos e manter consultas de rotina."}];
const QUIZZES={vapes:{title:"Perigos do cigarro eletrônico",eyebrow:"VAPES · ENTENDA OS RISCOS",questions:QUESTIONS},saude:{title:"Saúde pública básica",eyebrow:"SAÚDE PÚBLICA · CONHEÇA O SUS",questions:HEALTH_QUESTIONS}};
let activeQuiz=null;
const app=document.querySelector('#app');let name='',questions=[],index=0,selected=null,answered=false,records=[],started=0;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function focusHeading(){const h=app.querySelector('h1,h2');if(h){h.tabIndex=-1;h.focus({preventScroll:true})}window.scrollTo({top:0,behavior:'auto'})}
function home(){app.innerHTML=`<div class="eyebrow">SAÚDE & CONHECIMENTO</div><h1>QUIZ ENF</h1><p class="intro">Entre com seu nome e escolha o tema do seu desafio: perigos do cigarro eletrônico ou saúde pública básica.</p><div class="facts"><span><b>2</b>temas</span><span><b>4</b>alternativas</span><span><b>Sem pressa</b>aprenda no seu ritmo</span></div><form class="card" id="entry"><label for="name">Seu nome ou apelido</label><input id="name" maxlength="60" autocomplete="given-name" placeholder="Como podemos te chamar?" value="${esc(name)}"><p class="error" id="error" role="alert"></p><button class="primary">Continuar</button><p class="fine">Seu nome aparece apenas nesta rodada. Sem cadastro ou senha.</p></form>`;document.querySelector('#entry').onsubmit=e=>{e.preventDefault();name=document.querySelector('#name').value.trim();if(!name){document.querySelector('#error').textContent='Digite seu nome ou apelido para começar.';document.querySelector('#name').focus();return}chooseQuiz();focusHeading()}}
function chooseQuiz(){app.innerHTML=`<div class="eyebrow">ESCOLHA SEU DESAFIO</div><h1>Olá, ${esc(name)}!</h1><p>Qual quiz você quer fazer agora? Cada tema tem 10 perguntas.</p><div class="topic-grid">${Object.entries(QUIZZES).map(([id,q])=>`<button class="topic-card" data-quiz="${id}"><span class="eyebrow">${id==='vapes'?'TEMA 01':'TEMA 02'}</span><h2>${esc(q.title)}</h2><p>${id==='vapes'?'Descubra os riscos dos vapes e seus efeitos na saúde.':'Teste seus conhecimentos sobre o SUS, prevenção e cuidados básicos.'}</p><span class="tag">10 perguntas · Escolher este quiz →</span></button>`).join('')}</div><button class="secondary" id="change-name">Trocar nome</button>`;app.querySelectorAll('[data-quiz]').forEach(b=>b.onclick=()=>startQuiz(b.dataset.quiz));document.querySelector('#change-name').onclick=()=>{home();focusHeading()}}
function startQuiz(id){activeQuiz=QUIZZES[id];questions=shuffle(activeQuiz.questions.map(q=>({...q,options:shuffle(q.options.map((text,i)=>({text,correct:i===q.correct_index})))})));index=0;records=[];started=Date.now();selected=null;answered=false;render();focusHeading()}

function render(){const q=questions[index];let correct=q.options.findIndex(o=>o.correct);app.innerHTML=`<div class="meta"><span>${esc(name)}</span><span>Pergunta ${index+1} de ${questions.length}</span></div><div class="progress" role="progressbar" aria-label="Progresso" aria-valuemin="0" aria-valuemax="10" aria-valuenow="${index}"><span style="width:${index/questions.length*100}%"></span></div><div class="card"><div class="eyebrow">${esc(activeQuiz.eyebrow)}</div><h2>${esc(q.prompt)}</h2><div role="group" aria-label="Alternativas">${q.options.map((o,i)=>`<button class="option ${i===selected?'selected':''} ${answered&&i===correct?'correct':''} ${answered&&i===selected&&i!==correct?'wrong':''}" data-index="${i}" aria-pressed="${selected===i}" ${answered?'disabled':''}><span class="letter">${'ABCD'[i]}</span><span>${esc(o.text)}</span></button>`).join('')}</div><p class="error" id="error" role="alert"></p>${answered?`<div class="feedback ${selected===correct?'':'bad'}" role="status"><strong>${selected===correct?'Você acertou!':'Vamos aprender com essa resposta.'}</strong>${selected!==correct?`<p>Resposta correta: ${esc(q.options[correct].text)}</p>`:''}<p>${esc(q.explanation)}</p></div>`:''}<button class="primary" id="action">${answered?(index===questions.length-1?'Ver meu resultado':'Próxima pergunta'):'Confirmar resposta'}</button></div>`;
app.querySelectorAll('.option').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.index);app.querySelectorAll('.option').forEach(x=>{x.classList.toggle('selected',x===b);x.setAttribute('aria-pressed',String(x===b))});document.querySelector('#error').textContent=''});
document.querySelector('#action').onclick=()=>{if(!answered){if(selected===null){document.querySelector('#error').textContent='Escolha uma alternativa antes de confirmar.';return}answered=true;records.push({prompt:q.prompt,selected:q.options[selected].text,correct:q.options[correct].text,isCorrect:selected===correct,explanation:q.explanation});render();document.querySelector('#action').focus({preventScroll:true})}else{index++;selected=null;answered=false;if(index===questions.length)result();else render();focusHeading()}}}
function result(){const score=records.filter(r=>r.isCorrect).length;let elapsed=Math.floor((Date.now()-started)/1000);app.innerHTML=`<div class="eyebrow">DESAFIO CONCLUÍDO</div><p>${esc(activeQuiz.title)}</p><h1>Boa participação,<br>${esc(name)}!</h1><div class="card"><span class="tag">${score>=8?'Excelente conhecimento':score>=5?'Você está no caminho':'Cada resposta é uma chance de aprender'}</span><div class="score">${score*10}% <small>${score}/10</small></div><p>${score>=8?'Você demonstrou conhecer bem o tema. Continue compartilhando informação.':'Revise as respostas abaixo para fortalecer seu conhecimento sobre o tema.'}</p><div class="meta"><span>${Math.floor(elapsed/60)} min ${elapsed%60} s</span><span>${10-score} para revisar</span></div><div class="actions"><button class="primary" id="again">Refazer este quiz</button><button class="secondary" id="themes">Escolher outro tema</button><button class="secondary" id="download">Baixar resultado</button></div></div><h2>O que você aprendeu</h2>${records.map((r,i)=>`<details><summary><span class="tag">${r.isCorrect?'Acertou':'Revisar'}</span> · ${i+1}. ${esc(r.prompt)}</summary><p>Sua resposta: ${esc(r.selected)}</p><p><strong>Resposta correta:</strong> ${esc(r.correct)}</p><p>${esc(r.explanation)}</p></details>`).join('')}`;document.querySelector('#again').onclick=()=>startQuiz(activeQuiz===QUIZZES.vapes?'vapes':'saude');document.querySelector('#themes').onclick=()=>{chooseQuiz();focusHeading()};document.querySelector('#download').onclick=()=>{const text=`QUIZ ENF — CLM D’OR\nTema: ${activeQuiz.title}\nParticipante: ${name}\nResultado: ${score}/10 (${score*10}%)\nTempo: ${elapsed} segundos\n\n`+records.map((r,i)=>`${i+1}. ${r.prompt}\nSua resposta: ${r.selected}\nCorreta: ${r.correct}\n${r.explanation}`).join('\n\n');const url=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='resultado-quiz-enf.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}}
document.querySelector('#share').onclick=async()=>{if(location.protocol==='file:'){document.querySelector('#status').textContent='Depois de publicar, copie o endereço público do quiz.';return}try{await navigator.clipboard.writeText(location.href);document.querySelector('#status').textContent='Link copiado!'}catch(e){document.querySelector('#status').textContent='Copie o endereço na barra do navegador.'}};
home();
</script></body></html>
